<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="present.css">
</head>
<body>
    <div class="category-card" onclick="showMenu('african')">
        <div class="category-img-container">
            <img src="https://images.unsplash.com/photo-1604329760661-e71dc83f8f26?auto=format&fit=crop&w=600&q=80" alt="African Cuisine">
        </div>
        <h3>African Delicacies</h3>
        <h4 style="color: red;">GO TO THE CHECKOUT TO PLACE YOUR ORDER</h4>
        <p>Authentic local richness prepared to absolute perfection.</p>
        
    </div>
 
<section class="food-container">
    
    <div class="food-card">
      <div class="food-image-wrapper">
        <img src="images (12).jpg" alt="Jollof Rice" class="food-image">
      </div>
      <div class="food-info">
        <h3 class="food-name">Swallow and Soup</h3>
        <p class="food-price">₦3,500</p>
          <button onclick="addCart(this)">Add to Cart</button>
      </div>
    </div>
  
    
    <div class="food-card">
      <div class="food-image-wrapper">
        <img src="download (4).jpg" alt="Egusi Soup" class="food-image">
      </div>
      <div class="food-info">
        <h3 class="food-name">Ewa,MoiMoi and Egg</h3>
        <p class="food-price">₦4,000</p>
          <button onclick="addCart(this)">Add to Cart</button>
      </div>
    </div>
  
    
    <div class="food-card">
      <div class="food-image-wrapper">
        <img src="download (5).jpg" alt="Grilled Chicken" class="food-image">
      </div>
      <div class="food-info">
        <h3 class="food-name">Grilled Chicken</h3>
        <p class="food-price">₦2,500</p>
          <button onclick="addCart(this)">Add to Cart</button>
      </div>
    </div>
  
    
    <div class="food-card">
      <div class="food-image-wrapper">
        <img src="download (2).jpg" alt="Jollof rice" class="food-image">
      </div>
      <div class="food-info">
        <h3 class="food-name">Jollof rice</h3>
        <p class="food-price">₦3,000</p>
          <button onclick="addCart(this)">Add to Cart</button>
      </div>
    </div>
  </section>
  <script src="food-search.js"></script>
  <script src="restaurant.js"></script>
</body>
</html>
